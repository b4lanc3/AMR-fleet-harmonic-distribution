# =============================================================================
#  AMR Harmonic Factory - single source of truth for the whole simulation
# -----------------------------------------------------------------------------
#  This file is used by
#    * amr_fleet_manager  -> traffic graph (lanes, intersections, bays), stations,
#                           production process, chargers, parking
#    * generate_world     -> Gazebo SDF world (walls, racks, lines, markings)
#    * fleet_manager      -> occupancy grid + RViz markers
#    * dashboard          -> 2D map in the web UI
#
#  Coordinates: metres, map/world frame, origin = south-west corner of the hall.
#  Traffic is RIGHT-HAND: on a "dual" aisle the lane that runs in the aisle
#  direction (from -> to) lies on the right side of the centre line.
#  Lay-bys, docks and yield bays are always on the right side of a lane.
# =============================================================================

factory:
  name: "AMR Harmonic Factory"
  size: [100.0, 60.0]        # x (west->east), y (south->north)
  wall_height: 6.0
  wall_thickness: 0.3

traffic:
  lane_offset: 1.0           # dual lanes are +-1 m from the aisle centre line
  node_spacing: 2.0          # max distance between consecutive lane nodes
  bay_offset: 2.0            # lateral offset of lay-bys / yield bays
  dock_offset: 2.5           # lateral offset of charger docks / parking bays
  conflict_radius: 1.3       # two nodes closer than this can't be held by different robots
  sweep_radius: 1.1          # a node this close to an edge blocks traversal of that edge
  lane_speed: 1.0            # m/s on lanes
  bay_speed: 0.45            # m/s inside lay-bys, docks, bays
  two_way_cost_factor: 1.10  # planner penalty for single two-way lanes
  yield_bay_spacing: 14.0    # automatic yield bays every N metres (dual lanes)
  yield_bay_clearance: 0.75  # obstacle clearance required around a yield bay

# Aisles. type: dual -> two one-way lanes "<id>+" (from->to) and "<id>-" (to->from)
#              single -> one two-way lane "<id>" (narrow aisle, needs yield bays)
aisles:
  - {id: south, name: "Duong Nam",       type: dual,   from: [4.0, 5.0],  to: [96.0, 5.0]}
  - {id: spine, name: "Truc chinh",      type: dual,   from: [4.0, 30.0], to: [96.0, 30.0]}
  - {id: north, name: "Duong Bac 2 chieu", type: single, from: [4.0, 55.0], to: [96.0, 55.0],
     yield_side: left, yield_bay_spacing: 10.0}
  - {id: west,  name: "Duong Tay",       type: dual,   from: [5.0, 4.0],  to: [5.0, 55.0]}
  - {id: mid,   name: "Truc giua 2 chieu", type: single, from: [35.0, 4.0], to: [35.0, 55.0],
     yield_side: right, yield_bay_spacing: 8.0}
  - {id: east,  name: "Duong Dong",      type: dual,   from: [95.0, 4.0], to: [95.0, 55.0]}
  - {id: link,  name: "Ngo tat 2 chieu", type: single, from: [70.0, 4.0], to: [70.0, 55.0],
     yield_side: right, yield_bay_spacing: 8.0}

# Floor zones (visual + dashboard). rect = [xmin, ymin, xmax, ymax]
zones:
  - {id: A,   name: "Khu A - Kho linh kien",          rect: [7.0, 32.0, 33.0, 53.0],  color: [0.20, 0.55, 0.95]}
  - {id: B,   name: "Khu B - Day chuyen san xuat",    rect: [37.0, 32.0, 93.0, 53.0], color: [0.95, 0.60, 0.15]}
  - {id: C,   name: "Khu C - Day chuyen dong goi",    rect: [37.0, 7.0, 93.0, 28.0],  color: [0.60, 0.35, 0.90]}
  - {id: D,   name: "Khu D - Kho thanh pham",         rect: [7.0, 7.0, 33.0, 28.0],   color: [0.20, 0.75, 0.40]}
  - {id: CHG, name: "Tram sac tu dong (5 dock)",      rect: [60.0, 32.4, 79.0, 35.4], color: [0.95, 0.85, 0.10]}
  - {id: PK,  name: "Bai do Tay",                      rect: [0.0, 9.0, 2.8, 51.0],    color: [0.55, 0.55, 0.55]}
  - {id: PK2, name: "Bai do Dong",                     rect: [97.2, 9.0, 100.0, 50.0], color: [0.55, 0.55, 0.55]}

# Stations are drive-through lay-bys on the right side of a lane:
#   lane -> Q (queue slot) -> S (service slot) -> lane.  `at` = point on the lane
# next to S.  type: pickup | dropoff.  object: what stands next to S.
# On a two-way lane the lay-by can only be entered in the lane's "from -> to"
# direction; robots coming the other way pass it and turn into Q, so a robot
# waiting for a busy station never blocks the lane.
stations:
  # --- Zone A : component supermarket (pick-up of component kits) -----------
  #     on the natural loop D -> west+ (north) -> A -> north (east) -> B_IN
  - {id: A1, zone: A, type: pickup,  lane: west+,  at: [6.0, 37.0],  object: kit_rack}
  - {id: A2, zone: A, type: pickup,  lane: west+,  at: [6.0, 43.0],  object: kit_rack}
  - {id: A3, zone: A, type: pickup,  lane: west+,  at: [6.0, 49.0],  object: kit_rack}
  - {id: A4, zone: A, type: pickup,  lane: north,  at: [14.0, 55.0], object: kit_rack}
  # --- Zone B : production lines (input = kits, output = boxes of products) --
  - {id: B1_IN,  zone: B, type: dropoff, lane: north,  at: [44.0, 55.0], object: conveyor_in}
  - {id: B2_IN,  zone: B, type: dropoff, lane: north,  at: [56.0, 55.0], object: conveyor_in}
  - {id: B3_IN,  zone: B, type: dropoff, lane: north,  at: [84.0, 55.0], object: conveyor_in}
  - {id: B1_OUT, zone: B, type: pickup,  lane: spine-, at: [44.0, 31.0], object: conveyor_out}
  - {id: B2_OUT, zone: B, type: pickup,  lane: spine-, at: [56.0, 31.0], object: conveyor_out}
  - {id: B3_OUT, zone: B, type: pickup,  lane: spine-, at: [84.0, 31.0], object: conveyor_out}
  # --- Zone C : packaging lines (input = boxes, output = finished pallets) ---
  - {id: C1_IN,  zone: C, type: dropoff, lane: spine+, at: [52.0, 29.0], object: conveyor_in}
  - {id: C2_IN,  zone: C, type: dropoff, lane: spine+, at: [84.0, 29.0], object: conveyor_in}
  - {id: C1_OUT, zone: C, type: pickup,  lane: south-, at: [52.0, 6.0],  object: conveyor_out}
  - {id: C2_OUT, zone: C, type: pickup,  lane: south-, at: [84.0, 6.0],  object: conveyor_out}
  # --- Zone D : finished goods storage ---------------------------------------
  - {id: D1, zone: D, type: dropoff, lane: south-, at: [28.0, 6.0], object: storage_table}
  - {id: D2, zone: D, type: dropoff, lane: south-, at: [22.0, 6.0], object: storage_table}
  - {id: D3, zone: D, type: dropoff, lane: south-, at: [16.0, 6.0], object: storage_table}
  - {id: D4, zone: D, type: dropoff, lane: south-, at: [10.0, 6.0], object: storage_table}

