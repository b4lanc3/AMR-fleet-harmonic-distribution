# -----------------------------------------------------------------------------
#  Manufacturing process (simulated MES).  Cycle:
#   A (kit of components) --AMR--> B_IN  -> production line -> unpacked products
#   products are put into boxes at B_OUT  --AMR--> C_IN -> packaging line packs
#   every product -> finished pallet at C_OUT --AMR--> D (finished goods store)
# -----------------------------------------------------------------------------
process:
  load_time: 8.0              # s to load a robot at a pick-up station
  unload_time: 8.0            # s to unload at a drop-off station
  supply_stations: [A1, A2, A3, A4]
  storage_stations: [D1, D2, D3, D4]
  storage_capacity: 240       # products per D station before it is shipped out
  production_lines:
    - {id: B1, name: "Day chuyen SX 1", input: B1_IN, output: B1_OUT, cycle_time: 16.0,
       products_per_kit: 12, box_capacity: 6, input_capacity: 3, output_capacity: 2, target_input: 2}
    - {id: B2, name: "Day chuyen SX 2", input: B2_IN, output: B2_OUT, cycle_time: 16.0,
       products_per_kit: 12, box_capacity: 6, input_capacity: 3, output_capacity: 2, target_input: 2}
    - {id: B3, name: "Day chuyen SX 3", input: B3_IN, output: B3_OUT, cycle_time: 16.0,
       products_per_kit: 12, box_capacity: 6, input_capacity: 3, output_capacity: 2, target_input: 2}
  packaging_lines:
    - {id: C1, name: "Day chuyen dong goi 1", input: C1_IN, output: C1_OUT, pack_time: 9.0,
       input_capacity: 3, output_capacity: 2}
    - {id: C2, name: "Day chuyen dong goi 2", input: C2_IN, output: C2_OUT, pack_time: 9.0,
       input_capacity: 3, output_capacity: 2}
