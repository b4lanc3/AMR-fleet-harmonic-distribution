# Nav2 parameters of ONE AMR.  The launch file replaces
#   ROBOT  -> namespace / frame prefix (amr_01 ...)
#   INIT_X, INIT_Y, INIT_YAW -> spawn pose (AMCL initial pose)
# and passes the result to the robot's component container.
#
# Stack per robot:  AMCL (localisation on the shared /map)
#                   controller_server (Regulated Pure Pursuit, local costmap
#                       with 2D lidar + RGB-D point cloud)  -> cmd_vel_nav
#                   collision_monitor (lidar + RGB-D stop / slow zones)
#                       cmd_vel_nav -> cmd_vel
#                   [full stack: planner_server, behavior_server, bt_navigator]
# The fleet manager owns traffic: the robot agent sends the lane route that
# traffic control has granted to controller_server through FollowPath.

/ROBOT/amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "ROBOT/base_footprint"
    odom_frame_id: "ROBOT/odom"
    global_frame_id: "map"
    map_topic: "/map"
    scan_topic: "/ROBOT/scan"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # wheel odometry of the AMR is good on the epoxy floor: low motion noise keeps
    # the particles from spreading along the long aisles, where walls and racks
    # parallel to the lane give the lidar little along-track information
    alpha1: 0.05
    alpha2: 0.03
    alpha3: 0.03
    alpha4: 0.03
    alpha5: 0.03
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 1.0
    laser_max_range: 20.0
    laser_min_range: 0.1
    max_beams: 180
    min_particles: 200
    max_particles: 1000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    sigma_hit: 0.1
    z_hit: 0.85
    z_max: 0.03
    z_rand: 0.1
    z_short: 0.02
    lambda_short: 0.1
    do_beamskip: false
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.1
    update_min_d: 0.1
    save_pose_rate: 0.5
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: true
    initial_pose:
      x: INIT_X
      y: INIT_Y
      z: 0.0
      yaw: INIT_YAW

/ROBOT/controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    odom_topic: "odom"
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 120.0     # waiting for a grant / a station is normal
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.5
      lookahead_dist: 0.9
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.7
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 1.6
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.06
      approach_velocity_scaling_dist: 0.9
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.35
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 3.5
      max_robot_pose_search_dist: 10.0
      allow_reversing: false
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.4
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

/ROBOT/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: true
    update_frequency: 5.0
    publish_frequency: 1.0
    global_frame: "ROBOT/odom"
    robot_base_frame: "ROBOT/base_footprint"
    rolling_window: true
    width: 5
    height: 5
    resolution: 0.05
    transform_tolerance: 0.5
    footprint: "[[0.43, 0.30], [0.43, -0.30], [-0.42, -0.30], [-0.42, 0.30]]"
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: scan points
      scan:
        topic: "/ROBOT/scan"
        data_type: "LaserScan"
        clearing: true
        marking: true
        # beams along a long aisle hit nothing within range (inf): they must still
        # clear the cells they cross, or robots that passed leave ghost obstacles
        inf_is_valid: true
        max_obstacle_height: 2.0
        raytrace_max_range: 6.0
        raytrace_min_range: 0.0
        obstacle_max_range: 5.0
        obstacle_min_range: 0.0
      points:
        topic: "/ROBOT/camera/points"
        data_type: "PointCloud2"
        clearing: false
        marking: true
        min_obstacle_height: 0.06
        max_obstacle_height: 1.9
        obstacle_max_range: 3.0
        obstacle_min_range: 0.2
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 4.0
      inflation_radius: 0.45
    always_send_full_costmap: false

/ROBOT/collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "ROBOT/base_footprint"
    odom_frame_id: "ROBOT/odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 0.5        # then the docking server may drive the robot
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "polygon"
      points: "[[0.85, 0.32], [0.85, -0.32], [0.44, -0.32], [0.44, 0.32]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    PolygonSlow:
      type: "polygon"
      points: "[[1.75, 0.40], [1.75, -0.40], [0.44, -0.40], [0.44, 0.40]]"
      action_type: "slowdown"
      slowdown_ratio: 0.4
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
      enabled: true
    observation_sources: ["scan", "points"]
    # a stale source stops the robot: the RGB-D camera renders slower than the
    # lidar (much slower without a GPU), so it gets a longer validity window
    scan:
      type: "scan"
      topic: "/ROBOT/scan"
      source_timeout: 2.0
      enabled: true
    points:
      type: "pointcloud"
      topic: "/ROBOT/camera/points"
      min_height: 0.06
      max_height: 1.9
      source_timeout: 6.0
      enabled: true

# Precise docking on the chargers (opennav_docking).  The fleet route ends on the
# dock node = staging pose; the docking server drives the last 0.5 m with the
# dock pose detected by the robot agent from the lidar (charger face), not from
# AMCL.  Its velocity goes straight to cmd_vel: inside the stop zone of the
# collision monitor the charger itself would stop the robot before contact.
/ROBOT/docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 40.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 2
    base_frame: "ROBOT/base_footprint"
    fixed_frame: "ROBOT/odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["charger"]
    charger:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.03
      staging_x_offset: -0.50          # core/docking.py DOCK_DEPTH
      staging_yaw_offset: 0.0
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.2
    docks: DOCKS                       # one entry per charger, filled by the launch file
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.20
      v_angular_max: 0.6
      slowdown_radius: 0.25
      use_collision_detection: false
      transform_tolerance: 0.5

/ROBOT/lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 0.0
    attempt_respawn_reconnection: true
    node_names: NODE_NAMES

# ---------------------------------------------------------------- full stack
/ROBOT/planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: false

/ROBOT/global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: true
    update_frequency: 1.0
    publish_frequency: 0.5
    global_frame: "map"
    robot_base_frame: "ROBOT/base_footprint"
    resolution: 0.05
    transform_tolerance: 0.5
    track_unknown_space: true
    footprint: "[[0.43, 0.30], [0.43, -0.30], [-0.42, -0.30], [-0.42, 0.30]]"
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_topic: "/map"
      map_subscribe_transient_local: true
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: scan
      scan:
        topic: "/ROBOT/scan"
        data_type: "LaserScan"
        clearing: true
        marking: true
        max_obstacle_height: 2.0
        inf_is_valid: true
        raytrace_max_range: 8.0
        obstacle_max_range: 6.0
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.6
    always_send_full_costmap: false

/ROBOT/behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: "local_costmap/costmap_raw"
    global_costmap_topic: "global_costmap/costmap_raw"
    local_footprint_topic: "local_costmap/published_footprint"
    global_footprint_topic: "global_costmap/published_footprint"
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: "ROBOT/odom"
    global_frame: "map"
    robot_base_frame: "ROBOT/base_footprint"
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

/ROBOT/bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: "map"
    robot_base_frame: "ROBOT/base_footprint"
    odom_topic: "odom"
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
