# Workers walking in the factory (Gazebo only).  The fleet manager does not plan
# around them: each AMR's Nav2 collision monitor (270 deg lidar sees the legs,
# the RGB-D camera the whole body) slows down / stops while a person is ahead.
# Walkways are painted along the routes, zebra crossings where they cross a lane.
# A worker waits while a moving AMR is closer than stop_distance ahead and turns
# back if an AMR keeps standing on the walkway.  loop: false = walk back and forth.
people:
  stop_distance: 2.0
  workers:
    - {name: picker_A, speed: 0.9, vest: orange, helmet: white,
       waypoints: [[12.0, 44.25], [32.0, 44.25], [32.0, 53.25], [12.0, 53.25]], dwell: [6, 0, 0, 6]}
    - {name: picker_D, speed: 0.9, vest: yellow, helmet: white,
       waypoints: [[12.0, 22.75], [32.0, 22.75], [32.0, 13.75], [12.0, 13.75]], dwell: [5, 0, 0, 5]}
    - {name: operator_B12, speed: 1.0, vest: lime, helmet: blue,
       waypoints: [[48.5, 61.5], [48.5, 44.5]], dwell: [4, 4]}
    - {name: operator_B34, speed: 1.0, vest: lime, helmet: blue,
       waypoints: [[70.5, 44.5], [70.5, 61.5]], dwell: [4, 4]}
    - {name: operator_C12, speed: 1.0, vest: orange, helmet: yellow,
       waypoints: [[50.4, 13.0], [50.4, 28.0]], dwell: [4, 4]}
    - {name: operator_C34, speed: 1.0, vest: orange, helmet: yellow,
       waypoints: [[72.4, 28.0], [72.4, 13.0]], dwell: [4, 4]}
    - {name: material_handler, speed: 1.1, vest: yellow, helmet: red,   # crosses the main aisle
       waypoints: [[60.0, 57.0], [60.0, 41.0], [60.0, 39.6], [60.0, 32.4], [60.0, 31.0], [60.0, 22.0]],
       dwell: [5, 0, 0, 0, 0, 5]}
    - {name: supervisor, speed: 1.0, vest: orange, helmet: white,       # crosses the mid lane
       waypoints: [[32.0, 48.7], [38.4, 48.7], [38.4, 46.0]], dwell: [5, 0, 3]}

# -----------------------------------------------------------------------------
#  Manufacturing process (simulated MES).  Material flow, one carton per trip:
#   A (carton with a kit of 16 components) --AMR--> B_IN pedestal
#   the loader arm puts every component on the belt; the line machines it into a
#   product; at the end the loader arm packs the products into a carton on the
#   B_OUT pedestal --AMR--> D inbound (DI): finished goods warehouse
#   D outbound (DO) --AMR--> C_IN pedestal -> packaging line wraps every product
#   -> shipping carton on the C_OUT pedestal --AMR--> G gate -> truck
#  Every product needs `cycle_time` / `pack_time` of the line (takt) and
#  loader_time + belt length / belt_speed + drop_time to cross it (lead time).
#  Headless study (60 min after warm-up, robots_per_line 1.5): 16 products per
#  carton instead of 12 cut the AMR trips per product by a quarter, so the extra
#  warehouse trip costs nothing: 5 robots ship ~450 products/h, 6 ~560, 7 ~580,
#  8 ~640 (old direct flow: 437 / 509 / 588 / 648); 2.0 and 2.5 were lower.
# -----------------------------------------------------------------------------
process:
  load_time: 8.0              # s to load a robot at a pick-up station
  unload_time: 8.0            # s to unload at a drop-off station
  supply_stations: [A1, A2, A3, A4, A5]
  warehouse:                  # finished goods warehouse (zone D), counted in cartons
    inbound: [DI1, DI2]       # put-away from the production lines
    outbound: [DO1, DO2]      # picking for the packaging lines
    capacity: 40
    initial_stock: 6          # the packaging lines run from t = 0
  gates: [G1, G2, G3]         # shipping gates (zone G)
  truck_capacity: 24          # cartons per truck (2 rows of 4 x 3 in the trailer), then it leaves and the next one docks
  initial_wip: true           # start with work in progress on every line (factory already running)
  loader_time: 5.0            # s: loader arm carton -> belt (and belt -> carton)
  drop_time: 5.0
  belt_speed: 0.2             # m/s
  # Lines that run: "all", or "auto" = ceil(robots online / robots_per_line),
  # west lines first (4 robots: 3 + 3 lines, 5-8 robots: all 4 + 4; headless:
  # 6 robots make 509 products/h on 4 lines, 499/h on 3).  A line switched off
  # finishes its work in progress and gets no new kits / cartons.
  active_lines: auto
  robots_per_line: 1.5
  production_lines:
    - {id: B1, name: "Day chuyen SX 1", input: B1_IN, output: B1_OUT, cycle_time: 22.0,
       products_per_kit: 16, box_capacity: 16, input_capacity: 2, output_capacity: 2, target_input: 2}
    - {id: B2, name: "Day chuyen SX 2", input: B2_IN, output: B2_OUT, cycle_time: 22.0,
       products_per_kit: 16, box_capacity: 16, input_capacity: 2, output_capacity: 2, target_input: 2}
    - {id: B3, name: "Day chuyen SX 3", input: B3_IN, output: B3_OUT, cycle_time: 22.0,
       products_per_kit: 16, box_capacity: 16, input_capacity: 2, output_capacity: 2, target_input: 2}
    - {id: B4, name: "Day chuyen SX 4", input: B4_IN, output: B4_OUT, cycle_time: 22.0,
       products_per_kit: 16, box_capacity: 16, input_capacity: 2, output_capacity: 2, target_input: 2}
  packaging_lines:
    - {id: C1, name: "Day chuyen dong goi 1", input: C1_IN, output: C1_OUT, pack_time: 21.0,
       input_capacity: 2, output_capacity: 2}
    - {id: C2, name: "Day chuyen dong goi 2", input: C2_IN, output: C2_OUT, pack_time: 21.0,
       input_capacity: 2, output_capacity: 2}
    - {id: C3, name: "Day chuyen dong goi 3", input: C3_IN, output: C3_OUT, pack_time: 21.0,
       input_capacity: 2, output_capacity: 2}
    - {id: C4, name: "Day chuyen dong goi 4", input: C4_IN, output: C4_OUT, pack_time: 21.0,
       input_capacity: 2, output_capacity: 2}
