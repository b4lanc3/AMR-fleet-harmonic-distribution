# =============================================================================
#  AMR Harmonic Factory LITE (4 + 4 lines, 5-8 AMRs) - single source of truth
# -----------------------------------------------------------------------------
#  Used by
#    * amr_fleet_manager  -> traffic graph (lanes, intersections, bays), stations,
#                           production process (MES), chargers, parking
#    * generate_world     -> Gazebo SDF world (building, racks, production and
#                           packaging lines with moving products, offices, ...)
#                           + occupancy map for map_server / AMCL
#    * RViz markers and the web dashboard
#
#  Coordinates: metres, map/world frame, origin = south-west inner corner of
#  the hall.  Traffic is RIGHT-HAND: on a "dual" aisle the lane that runs in
#  the aisle direction (from -> to) lies on the right of the centre line.
#  Lay-bys, docks and yield bays are on the right side of a lane.
# =============================================================================

factory:
  name: "AMR Harmonic Factory Lite"
  size: [90.0, 75.0]         # x (west->east), y (south->north)
  wall_height: 10.0
  wall_thickness: 0.4

traffic:
  lane_offset: 1.0           # dual lanes are +-1 m from the aisle centre line
  node_spacing: 2.0          # max distance between consecutive lane nodes
  bay_offset: 2.0            # lateral offset of lay-bys / yield bays
  dock_offset: 2.5           # lateral offset of charger docks / parking bays
  conflict_radius: 1.3       # two nodes closer than this can't be held by different robots
  sweep_radius: 1.1          # a node this close to an edge blocks traversal of that edge
  lane_speed: 1.5            # m/s on lanes
  bay_speed: 0.65            # m/s inside lay-bys, docks, bays
  pass_offset: 0.7           # two-way lanes: robots meeting head-on both shift this far to their right
  pass_clearance: 0.55       # free space required around a shifted robot centre
  crossing_speed: 0.9        # m/s on edges that cross a walkway of the workers
  two_way_cost_factor: 1.10  # planner penalty for single two-way lanes
  yield_bay_spacing: 14.0    # automatic yield bays every N metres (dual lanes)
  yield_bay_clearance: 0.75  # obstacle clearance required around a yield bay
  crossover_spacing: 20.0    # U-turn crossovers between the two lanes of a dual aisle every N m (0: none)

# Aisles. type: dual   -> two one-way lanes "<id>+" (from->to) and "<id>-" (to->from)
#         type: single -> one two-way lane "<id>" (narrow aisle with yield bays)
aisles:
  - {id: south, name: "Duong Nam",          type: dual,   from: [4.0, 5.0],   to: [86.0, 5.0]}
  - {id: spine, name: "Truc chinh",         type: dual,   from: [4.0, 36.0],  to: [86.0, 36.0]}
  - {id: north, name: "Duong Bac",          type: dual,   from: [4.0, 70.0],  to: [86.0, 70.0]}
  - {id: west,  name: "Duong Tay",          type: dual,   from: [5.0, 4.0],   to: [5.0, 71.0]}
  - {id: mid,   name: "Truc giua 2 chieu",  type: single, from: [35.0, 4.0],  to: [35.0, 71.0],
     yield_side: right, yield_bay_spacing: 8.0}
  - {id: east,  name: "Duong Dong",         type: dual,   from: [85.0, 4.0],  to: [85.0, 71.0]}

# Floor zones (visual + dashboard). rect = [xmin, ymin, xmax, ymax]
zones:
  - {id: A,   name: "Khu A - Kho linh kien",          rect: [7.5, 38.5, 33.0, 65.5],  color: [0.20, 0.55, 0.95]}
  - {id: B,   name: "Khu B - 4 day chuyen san xuat",  rect: [37.0, 38.5, 82.5, 65.5], color: [0.95, 0.60, 0.15]}
  - {id: C,   name: "Khu C - 4 day chuyen dong goi",  rect: [37.0, 6.5, 82.5, 33.5],  color: [0.60, 0.35, 0.90]}
  - {id: D,   name: "Khu D - Kho thanh pham",         rect: [7.5, 6.5, 33.0, 33.5],   color: [0.20, 0.75, 0.40]}
  - {id: G,   name: "Khu G - Cong xuat hang",         rect: [8.0, 0.0, 32.0, 2.9],    color: [0.95, 0.80, 0.15]}
  - {id: PK,  name: "Bai do Tay",                     rect: [0.0, 8.5, 2.8, 63.5],    color: [0.55, 0.55, 0.55]}
  - {id: PK2, name: "Bai do Dong",                    rect: [87.2, 8.5, 90.0, 30.5],  color: [0.55, 0.55, 0.55]}

# Stations are drive-through lay-bys on the right side of a lane:
#   lane -> Q (queue slot) -> S (service slot) -> lane.  `at` = point on the lane
# next to S.  type: pickup | dropoff.  object: what stands next to S.
# On a two-way lane the lay-by can only be entered in the lane's "from -> to"
# direction; robots coming the other way pass it and turn into Q, so a robot
# waiting for a busy station never blocks the lane.
#   line_in / line_out: work cell at the end of a line - a station arm moves the
# cartons between the AMR and a 3-slot pedestal beside the line, a loader arm
# moves every product between the open carton on the pedestal and the belt.
stations:
  # --- Zone A : component supermarket (kits) -----------------------------------
  - {id: A1, zone: A, type: pickup,  lane: west+,  at: [6.0, 43.0],  object: kit_rack}
  - {id: A2, zone: A, type: pickup,  lane: west+,  at: [6.0, 49.0],  object: kit_rack}
  - {id: A3, zone: A, type: pickup,  lane: west+,  at: [6.0, 55.0],  object: kit_rack}
  - {id: A4, zone: A, type: pickup,  lane: north+, at: [14.0, 69.0], object: kit_rack}
  - {id: A5, zone: A, type: pickup,  lane: north+, at: [24.0, 69.0], object: kit_rack}
  # --- Zone B : 4 production lines (input = kits from the north aisle,
  #              output = cartons of unpacked products on the spine) -------------
  - {id: B1_IN,  zone: B, type: dropoff, lane: north+, at: [43.0, 69.0], object: line_in}
  - {id: B2_IN,  zone: B, type: dropoff, lane: north+, at: [54.0, 69.0], object: line_in}
  - {id: B3_IN,  zone: B, type: dropoff, lane: north+, at: [65.0, 69.0], object: line_in}
  - {id: B4_IN,  zone: B, type: dropoff, lane: north+, at: [76.0, 69.0], object: line_in}
  - {id: B1_OUT, zone: B, type: pickup,  lane: spine-, at: [43.0, 37.0], object: line_out}
  - {id: B2_OUT, zone: B, type: pickup,  lane: spine-, at: [54.0, 37.0], object: line_out}
  - {id: B3_OUT, zone: B, type: pickup,  lane: spine-, at: [65.0, 37.0], object: line_out}
  - {id: B4_OUT, zone: B, type: pickup,  lane: spine-, at: [76.0, 37.0], object: line_out}
  # --- Zone C : 4 packaging lines (input = cartons on the spine,
  #              output = cartons of finished goods on the south aisle) ----------
  - {id: C1_IN,  zone: C, type: dropoff, lane: spine+, at: [45.0, 35.0], object: line_in}
  - {id: C2_IN,  zone: C, type: dropoff, lane: spine+, at: [56.0, 35.0], object: line_in}
  - {id: C3_IN,  zone: C, type: dropoff, lane: spine+, at: [67.0, 35.0], object: line_in}
  - {id: C4_IN,  zone: C, type: dropoff, lane: spine+, at: [78.0, 35.0], object: line_in}
  - {id: C1_OUT, zone: C, type: pickup,  lane: south-, at: [45.0, 6.0],  object: line_out}
  - {id: C2_OUT, zone: C, type: pickup,  lane: south-, at: [56.0, 6.0],  object: line_out}
  - {id: C3_OUT, zone: C, type: pickup,  lane: south-, at: [67.0, 6.0],  object: line_out}
  - {id: C4_OUT, zone: C, type: pickup,  lane: south-, at: [78.0, 6.0],  object: line_out}
  # --- Zone D : finished goods warehouse, on the spine between the production
  #     outputs and the packaging inputs.  A robot from a production line output
  #     (westbound) turns at the west aisle and drives east past the put-away
  #     stations (DI), then the picking stations (DO), then the packaging
  #     inputs: a put-away and the next pick chain up without a detour. --------
  - {id: DI1, zone: D, type: dropoff, lane: spine+, at: [12.0, 35.0], object: wh_inbound}
  - {id: DI2, zone: D, type: dropoff, lane: spine+, at: [18.0, 35.0], object: wh_inbound}
  - {id: DO1, zone: D, type: pickup,  lane: spine+, at: [24.0, 35.0], object: wh_outbound}
  - {id: DO2, zone: D, type: pickup,  lane: spine+, at: [30.0, 35.0], object: wh_outbound}
  # --- Zone G : shipping gates in the south wall in front of the warehouse
  #     (dock door, roller table, truck outside).  The robots come from the
  #     packaging outputs (westbound), turn at the west aisle and leave east
  #     towards the mid aisle: the next kit pick-up is ~85 m away (gates east of
  #     the mid aisle would be closer to the packaging lines but ~165 m from it). --
  - {id: G1, zone: G, type: dropoff, lane: south+, at: [12.0, 4.0], object: ship_dock}
  - {id: G2, zone: G, type: dropoff, lane: south+, at: [20.0, 4.0], object: ship_dock}
  - {id: G3, zone: G, type: dropoff, lane: south+, at: [28.0, 4.0], object: ship_dock}

